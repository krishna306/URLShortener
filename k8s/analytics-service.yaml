apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: urlshortener
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres; do sleep 2; done"]
      containers:
        - name: analytics-service
          image: urlshortner-analytics-service:latest
          imagePullPolicy: Never
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/analytics_service?schema=public
            - name: REDIS_URL
              value: redis://redis:6379
            - name: PORT
              value: "4002"
          ports:
            - containerPort: 4002
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: urlshortener
spec:
  selector:
    app: analytics-service
  ports:
    - port: 4002
